name: Build static SEEYA site
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: seeya-generated-files
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node build.js
      - run: node scripts/check.js
      - name: Commit generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' assets sitemap.xml build-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build: regenerate static pages'
          git push
      - name: Request GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
