name: Update SEEYA news and static HTML
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
  pages: write
concurrency:
  group: seeya-generated-files
  cancel-in-progress: false
jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh news while retaining cache on failure
        id: refresh
        continue-on-error: true
        run: python scripts/update_news.py
      - run: node build.js
      - run: node scripts/check.js
      - name: Commit news and generated files together
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json '*.html' assets sitemap.xml build-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: update news and prerendered pages'
          git push
      - name: Request GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Report news source outage
        if: steps.refresh.outcome == 'failure'
        run: |
          echo 'News refresh failed. Existing articles were retained and the site rebuild was requested.'
          exit 1
