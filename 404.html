<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>404 | SEEYA ARCHIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  min-height:100vh;
  font-family:"Noto Sans KR",sans-serif;
  color:#58454d;
  background:
    radial-gradient(circle at 50% 40%,rgba(255,255,255,.98) 0 34%,rgba(255,249,251,.95) 62%,rgba(249,226,234,.78) 100%);
}
.error-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
}
.error-page:before,.error-page:after{
  content:"";
  position:absolute;
  width:360px;height:360px;border-radius:50%;
  border:1px solid rgba(218,143,165,.15);
  pointer-events:none;
}
.error-page:before{left:-220px;top:-180px}
.error-page:after{right:-240px;bottom:-190px}
.wrap{
  width:min(920px,100%);
  padding:46px 24px 34px;
  text-align:center;
  position:relative;
  z-index:1;
}
.archive{
  display:flex;align-items:center;justify-content:center;gap:18px;
  color:#c98297;font-family:"Gowun Batang",serif;
  font-size:12px;font-weight:700;letter-spacing:.42em;
}
.archive:before,.archive:after{content:"";width:42px;height:1px;background:#dca4b5}
.number-wrap{position:relative;width:max-content;margin:16px auto 0}
.number{
  position:relative;z-index:1;
  font-family:"Gowun Batang",serif;
  font-size:clamp(112px,20vw,205px);
  font-weight:400;line-height:.83;letter-spacing:-.08em;
  color:#efb4c2;
  text-shadow:0 2px 0 rgba(255,255,255,.9);
}
.orbit{
  position:absolute;left:50%;top:53%;width:118%;height:35%;
  border:1px solid rgba(215,126,151,.62);
  border-radius:50%;
  transform:translate(-50%,-50%) rotate(-7deg);
}
.spark{position:absolute;color:#df91a8;font-size:22px;line-height:1}
.spark.s1{left:-34px;top:46%}.spark.s2{right:-40px;top:5%;font-size:28px}.spark.s3{right:-14px;bottom:2%;font-size:13px}
.not-found{margin-top:13px;color:#c9889c;font-family:"Gowun Batang",serif;font-size:11px;font-weight:700;letter-spacing:.52em}
.pixel-wrap{margin:-1px auto 0;width:min(690px,90vw)}
.pixel{display:block;width:100%;height:auto}
.message{margin-top:5px}
.message h1{
  margin:0 0 10px;
  font-family:"Gowun Batang",serif;
  font-size:clamp(26px,4vw,38px);
  font-weight:700;color:#9e6878;
}
.message p{margin:0;color:#a28690;font-size:13px;line-height:1.9}
.home{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:210px;min-height:48px;padding:0 24px;margin-top:21px;
  border:1px solid #d993a8;border-radius:999px;
  color:#fff;background:linear-gradient(135deg,#dba0b1,#cc849a);
  box-shadow:0 9px 24px rgba(202,126,149,.18);
  text-decoration:none;font-weight:700;font-size:13px;
}
.home:hover{transform:translateY(-1px)}
.signature{margin-top:25px;color:#d594a7}
.signature:before{content:"";display:block;width:1px;height:28px;background:#d9a0b1;margin:0 auto 12px}
.signature strong{display:block;font-family:"Gowun Batang",serif;font-size:22px;font-style:italic;font-weight:400}
.signature small{display:block;margin-top:3px;font-size:8px;letter-spacing:.34em}
@media(max-width:600px){
  .wrap{padding:34px 14px 24px}
  .archive{gap:10px;font-size:10px;letter-spacing:.28em}
  .archive:before,.archive:after{width:26px}
  .number{font-size:clamp(104px,38vw,154px)}
  .pixel-wrap{width:104vw;margin-top:2px;margin-left:50%;transform:translateX(-50%)}
  .not-found{font-size:9px;letter-spacing:.34em;margin-top:9px}
  .message{margin-top:4px;padding:0 14px}
  .message p{font-size:12px}
  .signature{margin-top:20px}
}
</style>
</head>
<body>
<main class="error-page">
  <section class="wrap">
    <div class="archive">SEEYA ARCHIVE</div>
    <div class="number-wrap">
      <div class="orbit"></div>
      <span class="spark s1">✦</span><span class="spark s2">✧</span><span class="spark s3">✦</span>
      <div class="number">404</div>
    </div>
    <div class="not-found">PAGE NOT FOUND</div>

    <div class="pixel-wrap">
      <img class="pixel" src="images/common/seeya-pixel-characters.png" alt="">
    </div>

    <div class="message">
      <h1>이 페이지는 찾을 수 없어요.</h1>
      <p>요청하신 페이지가 존재하지 않거나, 이동되었을 수 있습니다.</p>
    </div>

    <a class="home" href="https://seeya-fanpage.com/">⌂&nbsp;&nbsp; 홈으로 돌아가기 &nbsp;›</a>

    <div class="signature">
      <strong>SeeYa</strong>
      <small>ALWAYS WITH YOU</small>
    </div>
  </section>
</main>
</body>
</html>
