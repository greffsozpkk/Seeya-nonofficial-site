<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7dce7"><meta name="robots" content="noindex,nofollow"><title>연결을 확인해 주세요 | SEEYA ARCHIVE</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;background:#fff8fb;color:#513a46;font-family:system-ui,-apple-system,sans-serif}.paper{width:100%;max-width:640px;padding:30px 28px;border:1px solid #e8cbd8;border-radius:22px;background:#fffdfd;box-shadow:0 12px 40px #7951650a;text-align:center}.eyebrow{color:#97667e;font-size:12px;letter-spacing:.18em}.offline-art{margin:24px 0;border-radius:16px;overflow:hidden;background:#211716}.offline-art img{display:block;width:100%;height:auto;max-height:42svh;object-fit:contain}h1{font-size:26px;line-height:1.5;word-break:keep-all;margin:0 0 12px}p{font-size:15px;line-height:1.9;word-break:keep-all;margin:0;color:#755c68}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:20px}.actions button,.actions a{font:inherit;font-size:14px;display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:12px 20px;border:1px solid #e3bdce;border-radius:24px;background:#f7e6ee;color:#754359;cursor:pointer;text-decoration:none}.actions a{background:white}.actions :focus-visible{outline:3px solid #93596f;outline-offset:4px}.note{margin-top:18px;font-size:12px;color:#846c77}@media(max-width:400px){body{padding:18px}.paper{padding:24px 18px}.offline-art{margin:20px 0}h1{font-size:23px}}
</style></head><body><main class="paper"><div class="eyebrow">SEEYA ARCHIVE</div><figure class="offline-art"><img src="{{offlineIllustration}}" width="1536" height="1024" alt="함께 손을 모으고 웃는 씨야 세 멤버 캐릭터"></figure><h1>잠시 연결이 끊겼어요</h1><p>지금은 페이지를 불러올 수 없어요.<br>Wi-Fi나 모바일 데이터 연결을 확인한 뒤<br>다시 시도해 주세요.</p><div class="actions"><button type="button" id="retry">다시 시도</button><a href="/">홈으로</a></div><p class="note">씨야의 기록은 인터넷에 연결되면<br>다시 만나볼 수 있어요.</p></main><script>document.getElementById('retry').addEventListener('click',function(){if(location.pathname==='/offline.html')location.assign('/');else location.reload();});</script></body></html>
