<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7dce7"><title>SEEYA ARCHIVE</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--pink:#f7dce7;--pale:#fff2f7;--rose:#d987a6;--deep:#8e4965;--ink:#38262e;--muted:#7c6871;--line:#ecd6df;--ivory:#fffaf7}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fffafb,#fff6fa);color:var(--ink);font-family:"Gowun Dodum",sans-serif}a{color:inherit;text-decoration:none}
aside{position:fixed;inset:0 auto 0 0;width:225px;padding:30px 22px;background:#fffafbdf;backdrop-filter:blur(16px);border-right:1px solid var(--line)}
.brand,h1,h2,h3{font-family:"Gowun Batang"}.brand{font-weight:800;letter-spacing:.18em}.brand small{display:block;font:9px "Noto Sans KR";color:var(--rose);letter-spacing:.2em;margin-top:7px}
nav{display:grid;gap:5px;margin-top:35px}nav a{padding:9px 10px;border-left:2px solid transparent;font-size:12px;color:var(--muted)}nav a:hover{border-color:var(--rose);color:var(--deep);background:linear-gradient(90deg,var(--pale),transparent)}
main{margin-left:225px}.page{max-width:1160px;margin:auto;padding:50px 46px 90px}.hero{min-height:72vh;display:flex;align-items:center;position:relative}.hero:after{content:"";position:absolute;right:2%;width:38vw;height:38vw;max-width:440px;max-height:440px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 7%,#fae4ed 30%,#f2c4d7 62%,transparent 70%);z-index:-1}
.eye{font-size:10px;letter-spacing:.22em;color:var(--rose);font-weight:700}h1{font-size:clamp(42px,6vw,78px);line-height:1.04;letter-spacing:-.04em;margin:15px 0 20px}.lead{font-family:"Gowun Batang";font-size:18px;line-height:1.9;color:#604b55;max-width:700px}
.section{padding:60px 0;border-top:1px solid var(--line)}h2{font-size:30px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.box{padding:22px;border-top:2px solid var(--pink);background:#ffffff70}.box p{font-size:13px;color:var(--muted);line-height:1.75}
.today{display:grid;grid-template-columns:1.15fr .85fr;gap:20px}.fortune{background:linear-gradient(145deg,#563949,#30242f);color:#fff8fb;padding:32px;min-height:340px}.fortune h3{font-size:28px}.song{color:#f4c6d8;font-weight:700}.msg{font-family:"Gowun Batang";font-size:18px;line-height:1.9;margin:28px 0}.btn{border:1px solid #e8bcd0;background:transparent;color:inherit;padding:10px 15px;cursor:pointer}.mini{display:grid;gap:12px}.notice{font-size:11px;color:var(--muted);line-height:1.7;padding:13px 15px;border-left:2px solid var(--rose);background:#fff6f9}
.tarothead{background:linear-gradient(135deg,#4a3343,#261e27);color:white;padding:38px;margin-bottom:24px}.tarothead p{color:#e8cbd7;line-height:1.8;max-width:720px}.tarotgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.tcard{min-height:235px;border:1px solid #e6c4d2;background:linear-gradient(160deg,#fffafd,var(--pink));padding:17px;cursor:pointer;transition:.2s}.tcard:hover{transform:translateY(-3px)}.tcard h3{font-size:16px}.tcard .song{color:var(--deep);margin-top:26px}.rel{font-size:10px;color:var(--muted);line-height:1.6;margin-top:8px}
.albums{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.album{aspect-ratio:1;border:1px solid var(--line);background:linear-gradient(145deg,#fff,#fcecf2);padding:16px;display:flex;flex-direction:column;justify-content:flex-end}.album b{font-family:"Gowun Batang"}
.timeline{border-left:1px solid var(--rose);padding-left:27px}.time{margin:0 0 28px;position:relative}.time:before{content:"";position:absolute;left:-33px;top:7px;width:9px;height:9px;border:2px solid var(--rose);background:var(--pink);border-radius:50%}.year{font:800 19px "Gowun Batang";color:var(--deep)}
.modal{display:none;position:fixed;inset:0;background:#21171dcc;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.on{display:flex}.modalbox{background:#fffafd;width:min(620px,100%);padding:32px;max-height:88vh;overflow:auto}.close{float:right;border:0;background:none;font-size:24px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chips span{border:1px solid var(--line);border-radius:99px;padding:6px 9px;font-size:11px}.mobile{display:none}
@media(max-width:850px){aside{display:none}main{margin:0}.mobile{display:flex;position:sticky;top:0;z-index:10;padding:11px 15px;gap:13px;overflow:auto;white-space:nowrap;background:#fffafbee;border-bottom:1px solid var(--line)}.mobile a{font-size:11px}.page{padding:35px 21px 70px}.grid3,.today{grid-template-columns:1fr}.tarotgrid,.albums{grid-template-columns:repeat(2,1fr)}}

.membergrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.membercard{padding:24px;background:#ffffff8a;border:1px solid var(--line);position:relative;overflow:hidden}
.membercard:after{content:"";position:absolute;width:110px;height:110px;right:-38px;top:-38px;background:var(--pink);border-radius:50%;opacity:.7}
.membercard h3{font-size:27px;margin:10px 0 2px}.eng{font-size:10px;color:var(--muted);letter-spacing:.15em}
.facts{margin:22px 0 18px;border-top:1px solid var(--line)}
.fact{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid #f1e5ea;font-size:11px}
.fact b{font-weight:400;color:var(--deep)}
.socials{display:flex;gap:9px}.social{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:#fff9fb;color:var(--deep)}
.social:hover{background:var(--pink)}.social svg{width:17px;height:17px;fill:currentColor}
.albums{grid-template-columns:repeat(3,1fr);gap:16px}
.album{aspect-ratio:auto;padding:0;display:block;background:#fff;overflow:hidden}
.album-cover{aspect-ratio:1;overflow:hidden;background:#fff0f5}
.album-cover img{width:100%;height:100%;object-fit:cover;display:block;transition:.25s}
.album:hover .album-cover img{transform:scale(1.025)}
.album-info{padding:16px}.album-info b{display:block;font-size:17px}.album-info small{display:block;margin-top:5px;color:var(--muted);line-height:1.6}
.album-link{display:inline-block;margin-top:10px;font-size:10px;color:var(--deep);border-bottom:1px solid #d9a7ba}
@media(max-width:850px){.membergrid{grid-template-columns:1fr}.albums{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.albums{grid-template-columns:1fr}}


.member-photo{width:116px;height:116px;border-radius:50%;overflow:hidden;border:6px solid #fff;box-shadow:0 8px 25px rgba(109,68,85,.12);margin:4px 0 18px;background:var(--pink)}
.member-photo img{width:100%;height:100%;object-fit:cover;display:block}
.member-role{font-family:"Gowun Batang",serif;font-size:11px;letter-spacing:.14em;color:var(--rose);text-transform:uppercase}
.channel-name{font-size:10px;color:var(--muted);margin-top:8px}


/* aespaofficial-inspired home */
.home-aespa{background:#fff;min-height:100vh}
.home-visual{
  min-height:calc(100vh - 0px);position:relative;overflow:hidden;background:#171217;
  display:flex;align-items:flex-end
}
.home-visual img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;filter:saturate(.92) contrast(.96)}
.home-visual:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(20,11,16,.04) 20%,rgba(20,11,16,.22) 62%,rgba(20,11,16,.78) 100%)
}
.home-copy{position:relative;z-index:2;width:100%;padding:54px clamp(24px,5vw,74px);color:#fff}
.home-kicker{font-size:11px;letter-spacing:.28em;text-transform:uppercase;opacity:.85}
.home-title{font:700 clamp(70px,11vw,170px)/.82 "Gowun Batang",serif;letter-spacing:-.075em;margin:14px 0 24px;text-shadow:0 3px 28px #24131b55}
.home-sub{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;border-top:1px solid #ffffff66;padding-top:17px}
.home-sub p{margin:0;max-width:560px;font-size:13px;line-height:1.85;color:#fff}
.home-scroll{font-size:10px;letter-spacing:.18em;white-space:nowrap}
.home-video{
  background:#f8e7ee;padding:110px clamp(24px,7vw,100px) 125px;
}
.home-video-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:32px}
.home-video-head h2{margin:0;font:700 clamp(42px,6.4vw,94px)/.94 "Gowun Batang",serif;letter-spacing:-.055em;color:#382b31}
.home-video-head p{max-width:360px;margin:0 0 7px;font-size:12px;line-height:1.8;color:#7d6670}
.home-video-frame{position:relative;padding-top:56.25%;background:#171217;overflow:hidden;box-shadow:0 28px 75px rgba(83,47,63,.16)}
.home-video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.home-channel{
  display:flex;justify-content:space-between;align-items:center;gap:18px;
  border-bottom:1px solid #be91a4;padding:18px 0 5px;margin-top:14px;
  font-size:11px;letter-spacing:.12em;color:#7f5063
}
.home-channel strong{font:700 17px "Gowun Batang",serif;letter-spacing:0;color:#5d3948}
.home-official{padding:120px clamp(24px,7vw,100px);background:#fffafc;text-align:center}
.home-official .tiny{font-size:10px;letter-spacing:.25em;color:#b4758d}
.home-official h2{font:700 clamp(40px,6vw,82px)/1 "Gowun Batang",serif;margin:15px 0 45px;letter-spacing:-.05em}.home-official .official-links{margin-top:28px}
.official-links{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.official-link{
  width:145px;height:145px;border-radius:50%;border:1px solid #ddb7c6;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:#fff;color:#8f536b;transition:.2s
}
.official-link:hover{background:#f7dce7;transform:translateY(-4px)}
.official-link svg{width:28px;height:28px;fill:currentColor}
.official-link span{font-size:10px;letter-spacing:.12em}
.home-credit{margin-top:50px;font-size:9px;line-height:1.7;color:#ab919b}
@media(max-width:850px){
 .home-visual{min-height:78vh}.home-copy{padding:38px 22px}.home-title{font-size:clamp(62px,20vw,108px)}
 .home-sub{display:block}.home-scroll{margin-top:18px}.home-video{padding:72px 22px 82px}
 .home-video-head{display:block}.home-video-head p{margin-top:18px}.home-official{padding:76px 22px}
}
@media(max-width:520px){
 .official-link{width:116px;height:116px}
 .home-video-head h2{font-size:48px}
}


.home-instagram{padding:110px clamp(24px,7vw,100px) 120px;background:#fffafc}
.insta-head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:30px}
.insta-head h2{margin:0;font:700 clamp(42px,6vw,82px)/.96 "Gowun Batang",serif;letter-spacing:-.05em}
.insta-profile{
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  padding:18px 0;border-top:1px solid #dfbdca;border-bottom:1px solid #dfbdca
}
.insta-left{display:flex;align-items:center;gap:14px}
.insta-avatar{
  width:58px;height:58px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(135deg,#f5c5d8,#fff);border:1px solid #dba9bd;
  font:700 19px "Gowun Batang",serif;color:#9c5b73
}
.insta-meta strong{display:block;font:700 16px "Gowun Batang",serif}
.insta-meta span{font-size:10px;color:#957985;letter-spacing:.05em}
.insta-follow{padding:10px 18px;border-radius:999px;background:#a55f79;color:#fff;font-size:10px;letter-spacing:.08em}
.insta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.insta-tile{position:relative;aspect-ratio:1;overflow:hidden;background:#f2dce5}
.insta-tile img{width:100%;height:100%;object-fit:cover;display:block;transition:.25s}
.insta-tile:after{content:"↗";position:absolute;right:12px;top:10px;color:#fff;font-size:18px;text-shadow:0 1px 8px #0006}
.insta-tile:hover img{transform:scale(1.025)}
@media(max-width:700px){
 .insta-head{display:block}.insta-profile{align-items:flex-start}.insta-grid{grid-template-columns:1fr 1fr}
}


/* HOME · Official Instagram feed */
.home-instagram .insta-head-simple{margin-bottom:30px}
.home-instagram .insta-head-simple h2{
  margin:0;font:700 clamp(42px,6vw,82px)/.96 "Gowun Batang",serif;
  letter-spacing:-.05em;color:#382b31
}
.home-instagram .insta-head-simple p{
  margin:14px 0 0;font-size:11px;line-height:1.8;color:#957985
}
.insta-posts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.insta-post{
  display:block;position:relative;aspect-ratio:1;background:#f1dfe6;overflow:hidden
}
.insta-post img{width:100%;height:100%;object-fit:cover;display:block;transition:.28s}
.insta-post:hover img{transform:scale(1.025)}
.insta-post:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 60%,rgba(35,20,27,.28));
  opacity:0;transition:.2s
}
.insta-post:hover:after{opacity:1}
@media(max-width:700px){.insta-posts{grid-template-columns:1fr 1fr}.insta-post:last-child{display:none}}


/* v2.6 · live Instagram + Google Sheets schedule */
.insta-post{cursor:pointer}
.insta-post .insta-badge{
  position:absolute;left:12px;bottom:10px;z-index:3;
  color:#fff;font-size:9px;letter-spacing:.08em;text-shadow:0 1px 7px #0008
}
.live-status{margin-top:14px;font-size:9px;color:#a58a94;letter-spacing:.06em}
.schedule-wrap{margin-top:26px}
.schedule-toolbar{
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)
}
.schedule-toolbar strong{font:700 18px "Gowun Batang",serif;color:#5d3948}
.schedule-toolbar a{font-size:10px;color:var(--deep);border-bottom:1px solid #d5a1b5}
.schedule-scroll{overflow:auto;border:1px solid var(--line);background:#fff}
.schedule-table{width:100%;border-collapse:collapse;min-width:680px}
.schedule-table th{
  position:sticky;top:0;background:#f8e6ed;color:#71475a;
  font-size:10px;letter-spacing:.08em;text-align:left;padding:13px 14px;
  border-bottom:1px solid #dcb9c7;white-space:nowrap
}
.schedule-table td{
  padding:13px 14px;border-bottom:1px solid #f0e0e6;
  vertical-align:top;font-size:11px;line-height:1.65;color:#55474d
}
.schedule-table tbody tr:hover{background:#fff7fa}
.schedule-loading,.schedule-error{padding:26px;text-align:center;font-size:11px;color:#987d88}
.schedule-error b{display:block;color:#7c5263;margin-bottom:7px}
@media(max-width:700px){
  .schedule-toolbar{align-items:flex-start;flex-direction:column}
}

const SCHEDULE_CSV_URL="https://docs.google.com/spreadsheets/d/1r7aGbHpoYf6f-ixZI3dNZ9v7Pnt0CAVRgKWWNxPdPhI/gviz/tq?tqx=out:csv&gid=0";

function esc(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))
}

async function loadInstagramFeed(){
  const box=document.getElementById("instagramPosts");
  const status=document.getElementById("instagramStatus");
  if(!box)return;
  try{
    const r=await fetch(INSTAGRAM_DATA_URL+"?v="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error("feed");
    const data=await r.json();
    const posts=(data.posts||[]).slice(0,3);
    if(posts.length<3)throw new Error("posts");
    box.innerHTML=posts.map((p,i)=>`<a class="insta-post" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer" aria-label="Instagram 최신 게시물 ${i+1}">
      <img src="${esc(p.image)}" alt="SEEYA Official Instagram post ${i+1}" loading="lazy">
      ${p.type==="video"?'<span class="insta-badge">VIDEO</span>':""}
    </a>`).join("");
    if(status){
      const t=data.updated_at?new Date(data.updated_at):null;
      status.textContent="OFFICIAL INSTAGRAM · 최신 게시물 3개 자동 갱신"+(t&&!isNaN(t)?" · "+t.toLocaleString("ko-KR"):"");
    }
  }catch(e){
    if(status)status.textContent="OFFICIAL INSTAGRAM · 자동 갱신 데이터를 불러오지 못해 기본 이미지를 표시 중입니다.";
  }
}

function parseCSV(text){
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i],n=text[i+1];
    if(c==='"'){
      if(q&&n==='"'){cell+='"';i++}
      else q=!q;
    }else if(c===","&&!q){row.push(cell);cell=""}
    else if((c==="\n"||c==="\r")&&!q){
      if(c==="\r"&&n==="\n")i++;
      row.push(cell);cell="";
      if(row.some(v=>v.trim()!==""))rows.push(row);
      row=[];
    }else cell+=c;
  }
  if(cell!==""||row.length){row.push(cell);if(row.some(v=>v.trim()!==""))rows.push(row)}
  return rows;
}

async function loadSchedule(){
  const box=document.getElementById("scheduleBox");
  if(!box)return;
  try{
    const r=await fetch(SCHEDULE_CSV_URL,{cache:"no-store"});
    if(!r.ok)throw new Error("sheet");
    const rows=parseCSV(await r.text());
    if(rows.length<1)throw new Error("empty");
    const maxCols=Math.max(...rows.map(r=>r.length));
    const normalized=rows.map(r=>Array.from({length:maxCols},(_,i)=>(r[i]||"").trim()));
    const used=Array.from({length:maxCols},(_,i)=>normalized.some(r=>r[i]!=="" ));
    const data=normalized.map(r=>r.filter((_,i)=>used[i]));
    let headers=data[0];
    let body=data.slice(1);

    box.innerHTML=`<table class="schedule-table"><thead><tr>${headers.map(h=>`<th>${esc(h||" ")}</th>`).join("")}</tr></thead>
      <tbody>${body.map(r=>`<tr>${headers.map((_,i)=>`<td>${esc(r[i]||"").replace(/\n/g,"<br>")}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  }catch(e){
    box.innerHTML=`<div class="schedule-error"><b>스케줄 시트를 불러오지 못했습니다.</b>Google Sheets의 공유 설정을 “링크가 있는 모든 사용자 · 뷰어”로 설정했는지 확인해주세요.</div>`;
  }
}
